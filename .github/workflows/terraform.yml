name: terraform-infrastructure

"on":
  pull_request:

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (dev, test, or prod)
        type: choice
        required: true
        default: dev
        options:
          - dev
          - test
          - prod
      apply:
        description: Apply the generated plan (test and prod require manual approval)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('terraform-pr-{0}', github.event.pull_request.number) || format('terraform-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-scans:
    name: Scan secrets and Terraform IaC
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl --fail --silent --show-error --location "$release_url/$archive" \
            --output "$RUNNER_TEMP/$archive"
          curl --fail --silent --show-error --location "$release_url/gitleaks_${version}_checksums.txt" \
            --output "$RUNNER_TEMP/gitleaks-checksums.txt"
          grep -E "  ${archive}$" "$RUNNER_TEMP/gitleaks-checksums.txt" \
            | (cd "$RUNNER_TEMP" && sha256sum --check)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Scan repository files for secrets
        run: gitleaks dir --redact --no-banner .

      - name: Install pre-commit
        run: python -m pip install --disable-pip-version-check pre-commit==4.7.0

      - name: Scan Terraform with Checkov
        run: pre-commit run checkov --all-files

  terraform-lint:
    name: Lint Terraform with TFLint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: 0.66.0
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install TFLint plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"

      - name: Lint Terraform configurations
        run: tflint --recursive --minimum-failure-severity=error --config="$GITHUB_WORKSPACE/.tflint.hcl"

  workflow-security:
    name: Audit GitHub Actions workflows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Audit workflows with zizmor
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: .github/workflows
          version: v1.33.1
          online-audits: false
          advanced-security: false
          annotations: true

  terraform-module-tests:
    name: Test infrastructure modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Validate bootstrap Terraform roots
        shell: bash
        run: |
          set -euo pipefail
          for root in \
            bootstrap \
            bootstrap/kms-dev-alerts \
            bootstrap/github-terraform-dev-plan \
            bootstrap/github-terraform-dev-apply \
            bootstrap/github-terraform-test-prod-plan \
            bootstrap/github-terraform-test-prod-apply; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done

      - name: Test required infrastructure modules
        shell: bash
        run: |
          set -euo pipefail
          for module in network security load-balancer compute database storage github-terraform-plan github-terraform-apply github-terraform-extensions notifications; do
            terraform -chdir="modules/$module" init -backend=false -input=false
            terraform -chdir="modules/$module" test
          done

      - name: Test S3 bootstrap with mocks
        run: terraform -chdir=bootstrap test

      - name: Run workflow contract tests
        run: python3 -m unittest discover -s scripts/gha -p "test_*.py" -v

      - name: Check generated IAM Apply policy sizes
        run: python3 scripts/gha/check_iam_apply.py

  plan-dev:
    name: Plan DEV
    outputs:
      plan_key: ${{ steps.store_plan.outputs.plan_key }}
      plan_sha: ${{ steps.store_plan.outputs.plan_sha }}
      plan_version: ${{ steps.store_plan.outputs.plan_version }}
      plan_bucket: ${{ steps.store_plan.outputs.plan_bucket }}
      commit_sha: ${{ steps.store_plan.outputs.commit_sha }}
      run_id: ${{ steps.store_plan.outputs.run_id }}
      run_attempt: ${{ steps.store_plan.outputs.run_attempt }}
      environment: ${{ steps.store_plan.outputs.environment }}
    needs:
      - security-scans
      - terraform-lint
      - workflow-security
      - terraform-module-tests
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'dev')
    runs-on: ubuntu-latest
    environment: dev-plan
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Require plan role and state bucket
        env:
          PLAN_ROLE: ${{ vars.AWS_TERRAFORM_DEV_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN_ROLE" = "arn:aws:iam::326553917564:role/cloud5-infra-dev-github-terraform-plan"
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_DEV_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: terraform-dev-plan

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform (dev)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/dev init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=eu-west-1"

      - name: Validate Terraform (dev)
        run: terraform -chdir=environments/dev validate

      - name: Plan Terraform (dev)
        id: terraform_plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/dev plan -input=false \
            -var-file="terraform.tfvars.example" \
            -out=tfplan > "$RUNNER_TEMP/terraform-dev-plan.log" 2>&1 || { echo "Terraform DEV plan failed; details remain on the runner." >&2; exit 1; }
      - name: Store failed plan diagnostic privately (dev)
        if: failure() && steps.terraform_plan.outcome == 'failure' && vars.TERRAFORM_DEV_S3_PLAN_HANDOFF_ENABLED == 'true'
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"
          key="cloud5/ci-plans/v1/dev/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/diagnostics/plan.log"
          version="$(aws s3api put-object --bucket "$STATE_BUCKET" --key "$key" --body "$RUNNER_TEMP/terraform-dev-plan.log" --server-side-encryption AES256 --if-none-match '*' --expected-bucket-owner 326553917564 --query VersionId --output text 2>/dev/null)"
          test -n "$version"
          test "$version" != "None"
          test "$version" != "null"
          printf 'Private diagnostic S3 key: %s; version: %s\n' "$key" "$version"
      - name: Store encrypted plan privately (dev)
        id: store_plan
        if: vars.TERRAFORM_DEV_S3_PLAN_HANDOFF_ENABLED == 'true'
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          key="cloud5/ci-plans/v1/dev/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/tfplan"
          sha="$(sha256sum environments/dev/tfplan | cut -d ' ' -f 1)"
          version="$(aws s3api put-object --bucket "$STATE_BUCKET" --key "$key" --body environments/dev/tfplan --server-side-encryption AES256 --if-none-match '*' --expected-bucket-owner 326553917564 --query VersionId --output text)"
          test -n "$version"
          test "$version" != "None"
          test "$version" != "null"
          printf 'plan_key=%s\nplan_sha=%s\nplan_version=%s\nplan_bucket=%s\n' "$key" "$sha" "$version" "$STATE_BUCKET" >> "$GITHUB_OUTPUT"
          printf 'commit_sha=%s\nrun_id=%s\nrun_attempt=%s\nenvironment=dev\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if ! terraform -chdir=environments/dev show -json tfplan 2> "$RUNNER_TEMP/dev-show.err" | python3 scripts/gha/summarize_plan.py > "$RUNNER_TEMP/dev-summary.txt"; then
            echo 'DEV plan summary failed.' >&2
            exit 1
          fi
          printf '### DEV plan metadata\n\n- Environment: `dev`\n- Commit SHA: `%s`\n- Run ID: `%s`\n- Run attempt: `%s`\n- Plan SHA-256: `%s`\n- S3 object key: `%s`\n- S3 version ID: `%s`\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$sha" "$key" "$version" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/dev-summary.txt" >> "$GITHUB_STEP_SUMMARY"

  apply-dev:
    name: Apply DEV
    needs:
      - plan-dev
    if: >-
      vars.TERRAFORM_DEV_S3_PLAN_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'dev' && inputs.apply
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: terraform-state-dev-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Require apply role and state bucket
        env:
          APPLY_ROLE: ${{ vars.AWS_TERRAFORM_DEV_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPLY_ROLE" = "arn:aws:iam::326553917564:role/cloud5-infra-dev-github-terraform-apply"
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_DEV_APPLY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: terraform-dev-apply

      - name: Verify private DEV diagnostic storage
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: bash scripts/gha/dev_diagnostics.sh preflight

      - name: Download and verify plan version (dev)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          PLAN_BUCKET: ${{ needs.plan-dev.outputs.plan_bucket }}
          PLAN_KEY: ${{ needs.plan-dev.outputs.plan_key }}
          PLAN_VERSION: ${{ needs.plan-dev.outputs.plan_version }}
          PLAN_SHA: ${{ needs.plan-dev.outputs.plan_sha }}
          PLAN_COMMIT: ${{ needs.plan-dev.outputs.commit_sha }}
          PLAN_RUN_ID: ${{ needs.plan-dev.outputs.run_id }}
          PLAN_RUN_ATTEMPT: ${{ needs.plan-dev.outputs.run_attempt }}
          PLAN_ENVIRONMENT: ${{ needs.plan-dev.outputs.environment }}
          TARGET_ENV: dev
        shell: bash
        run: bash scripts/gha/verify_plan_handoff.sh

      - name: Initialize Terraform (dev)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/dev init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=eu-west-1"

      - name: Enforce ownership on saved plan (dev)
        env:
          TERRAFORM_DESTRUCTION_APPROVAL: ${{ vars.TERRAFORM_DESTRUCTION_APPROVAL }}
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          bash scripts/gha/dev_diagnostics.sh gate python3 scripts/gha/check_plan_ownership.py --environment dev --plan environments/dev/tfplan

      - name: Apply Terraform plan (dev)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          bash scripts/gha/dev_diagnostics.sh apply terraform -chdir=environments/dev apply -input=false tfplan

  plan-test:
    name: Plan TEST
    outputs:
      plan_key: ${{ steps.store_plan.outputs.plan_key }}
      plan_sha: ${{ steps.store_plan.outputs.plan_sha }}
      plan_version: ${{ steps.store_plan.outputs.plan_version }}
      plan_bucket: ${{ steps.store_plan.outputs.plan_bucket }}
    needs:
      - security-scans
      - terraform-lint
      - workflow-security
      - terraform-module-tests
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'test')
    runs-on: ubuntu-latest
    environment: test-plan
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Require plan role and state bucket
        env:
          PLAN_ROLE: ${{ vars.AWS_TERRAFORM_TEST_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN_ROLE" = "arn:aws:iam::326553917564:role/cloud5-infra-test-github-terraform-plan"
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_TEST_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: terraform-test-plan

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform (test)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/test init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=eu-west-1"

      - name: Validate Terraform (test)
        run: terraform -chdir=environments/test validate

      - name: Plan Terraform (test)
        id: terraform_plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/test plan -input=false \
            -var-file="terraform.tfvars.example" \
            -out=tfplan > "$RUNNER_TEMP/terraform-test-plan.log" 2>&1 || { echo "Terraform TEST plan failed; details remain on the runner." >&2; exit 1; }
      - name: Store failed plan diagnostic privately (test)
        if: failure() && steps.terraform_plan.outcome == 'failure' && vars.TERRAFORM_TEST_S3_PLAN_HANDOFF_ENABLED == 'true'
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"
          key="cloud5/ci-plans/v1/test/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/diagnostics/plan.log"
          version="$(aws s3api put-object --bucket "$STATE_BUCKET" --key "$key" --body "$RUNNER_TEMP/terraform-test-plan.log" --server-side-encryption AES256 --if-none-match '*' --expected-bucket-owner 326553917564 --query VersionId --output text 2>/dev/null)"
          test -n "$version"
          test "$version" != "None"
          test "$version" != "null"
          printf 'Private diagnostic S3 key: %s; version: %s\n' "$key" "$version"
      - name: Store encrypted plan privately (test)
        id: store_plan
        if: vars.TERRAFORM_TEST_S3_PLAN_HANDOFF_ENABLED == 'true'
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          key="cloud5/ci-plans/v1/test/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/tfplan"
          sha="$(sha256sum environments/test/tfplan | cut -d ' ' -f 1)"
          version="$(aws s3api put-object --bucket "$STATE_BUCKET" --key "$key" --body environments/test/tfplan --server-side-encryption AES256 --if-none-match '*' --expected-bucket-owner 326553917564 --query VersionId --output text)"
          test -n "$version"
          test "$version" != "None"
          test "$version" != "null"
          printf 'plan_key=%s\nplan_sha=%s\nplan_version=%s\nplan_bucket=%s\n' "$key" "$sha" "$version" "$STATE_BUCKET" >> "$GITHUB_OUTPUT"
          printf 'TEST plan SHA-256: `%s`\n\nS3 key: `%s`\n\nVersion: `%s`\n' "$sha" "$key" "$version" >> "$GITHUB_STEP_SUMMARY"

  apply-test:
    name: Apply TEST
    needs:
      - plan-test
    if: >-
      vars.TERRAFORM_TEST_S3_PLAN_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'test' && inputs.apply
    runs-on: ubuntu-latest
    environment: test
    concurrency:
      group: terraform-state-test-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require private Apply diagnostics (test)
        shell: bash
        run: |
          echo "Apply is blocked until confidential diagnostic retention is implemented." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Require apply role and state bucket
        env:
          APPLY_ROLE: ${{ vars.AWS_TERRAFORM_TEST_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPLY_ROLE" = "arn:aws:iam::326553917564:role/cloud5-infra-test-github-terraform-apply"
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_TEST_APPLY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: terraform-test-apply

      - name: Download and verify plan version (test)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          PLAN_BUCKET: ${{ needs.plan-test.outputs.plan_bucket }}
          PLAN_KEY: ${{ needs.plan-test.outputs.plan_key }}
          PLAN_VERSION: ${{ needs.plan-test.outputs.plan_version }}
          PLAN_SHA: ${{ needs.plan-test.outputs.plan_sha }}
          APPROVED_SHA: ${{ vars.TERRAFORM_APPROVED_PLAN_SHA256 }}
          APPROVED_COMMIT: ${{ vars.TERRAFORM_APPROVED_COMMIT_SHA }}
          TARGET_ENV: test
        shell: bash
        run: bash scripts/gha/verify_plan_handoff.sh

      - name: Initialize Terraform (test)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/test init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=eu-west-1"

      - name: Enforce ownership on saved plan (test)
        env:
          TERRAFORM_DESTRUCTION_APPROVAL: ${{ vars.TERRAFORM_DESTRUCTION_APPROVAL }}
        shell: bash
        run: |
          python3 scripts/gha/check_plan_ownership.py --environment test --plan environments/test/tfplan > "$RUNNER_TEMP/terraform-test-ownership.log" 2>&1 || { echo "Ownership gate failed; diagnostic remains on the runner." >&2; exit 1; }

      - name: Apply Terraform plan (test)
        shell: bash
        run: |
          terraform -chdir=environments/test apply -input=false tfplan > "$RUNNER_TEMP/terraform-test-apply.log" 2>&1 || { echo "Terraform TEST apply failed; diagnostic remains on the runner." >&2; exit 1; }

  plan-prod:
    name: Plan PROD
    outputs:
      plan_key: ${{ steps.store_plan.outputs.plan_key }}
      plan_sha: ${{ steps.store_plan.outputs.plan_sha }}
      plan_version: ${{ steps.store_plan.outputs.plan_version }}
      plan_bucket: ${{ steps.store_plan.outputs.plan_bucket }}
    needs:
      - security-scans
      - terraform-lint
      - workflow-security
      - terraform-module-tests
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.environment == 'prod')
    runs-on: ubuntu-latest
    environment: prod-plan
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Require plan role and state bucket
        env:
          PLAN_ROLE: ${{ vars.AWS_TERRAFORM_PROD_PLAN_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN_ROLE" = "arn:aws:iam::326553917564:role/cloud5-infra-prod-github-terraform-plan"
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PROD_PLAN_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: terraform-prod-plan

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform (prod)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/prod init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=eu-west-1"

      - name: Validate Terraform (prod)
        run: terraform -chdir=environments/prod validate

      - name: Plan Terraform (prod)
        id: terraform_plan
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/prod plan -input=false \
            -var-file="terraform.tfvars.example" \
            -out=tfplan > "$RUNNER_TEMP/terraform-prod-plan.log" 2>&1 || { echo "Terraform PROD plan failed; details remain on the runner." >&2; exit 1; }
      - name: Store failed plan diagnostic privately (prod)
        if: failure() && steps.terraform_plan.outcome == 'failure' && vars.TERRAFORM_PROD_S3_PLAN_HANDOFF_ENABLED == 'true'
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"
          key="cloud5/ci-plans/v1/prod/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/diagnostics/plan.log"
          version="$(aws s3api put-object --bucket "$STATE_BUCKET" --key "$key" --body "$RUNNER_TEMP/terraform-prod-plan.log" --server-side-encryption AES256 --if-none-match '*' --expected-bucket-owner 326553917564 --query VersionId --output text 2>/dev/null)"
          test -n "$version"
          test "$version" != "None"
          test "$version" != "null"
          printf 'Private diagnostic S3 key: %s; version: %s\n' "$key" "$version"
      - name: Store encrypted plan privately (prod)
        id: store_plan
        if: vars.TERRAFORM_PROD_S3_PLAN_HANDOFF_ENABLED == 'true'
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          key="cloud5/ci-plans/v1/prod/${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}/tfplan"
          sha="$(sha256sum environments/prod/tfplan | cut -d ' ' -f 1)"
          version="$(aws s3api put-object --bucket "$STATE_BUCKET" --key "$key" --body environments/prod/tfplan --server-side-encryption AES256 --if-none-match '*' --expected-bucket-owner 326553917564 --query VersionId --output text)"
          test -n "$version"
          test "$version" != "None"
          test "$version" != "null"
          printf 'plan_key=%s\nplan_sha=%s\nplan_version=%s\nplan_bucket=%s\n' "$key" "$sha" "$version" "$STATE_BUCKET" >> "$GITHUB_OUTPUT"
          printf 'PROD plan SHA-256: `%s`\n\nS3 key: `%s`\n\nVersion: `%s`\n' "$sha" "$key" "$version" >> "$GITHUB_STEP_SUMMARY"

  apply-prod:
    name: Apply PROD
    needs:
      - plan-prod
    if: >-
      vars.TERRAFORM_PROD_S3_PLAN_HANDOFF_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' && inputs.environment == 'prod' && inputs.apply
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: terraform-state-prod-${{ github.repository }}
      cancel-in-progress: false
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require private Apply diagnostics (prod)
        shell: bash
        run: |
          echo "Apply is blocked until confidential diagnostic retention is implemented." >&2
          exit 1

      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Require apply role and state bucket
        env:
          APPLY_ROLE: ${{ vars.AWS_TERRAFORM_PROD_APPLY_ROLE_ARN }}
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          test "$APPLY_ROLE" = "arn:aws:iam::326553917564:role/cloud5-infra-prod-github-terraform-apply"
          test "$STATE_BUCKET" = "cloud5-terraform-drghassen-state-326553917564"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@b47578312673ae6fa5b5096b330d9fbac3d116df # v4.2.1
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_PROD_APPLY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: terraform-prod-apply

      - name: Download and verify plan version (prod)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
          PLAN_BUCKET: ${{ needs.plan-prod.outputs.plan_bucket }}
          PLAN_KEY: ${{ needs.plan-prod.outputs.plan_key }}
          PLAN_VERSION: ${{ needs.plan-prod.outputs.plan_version }}
          PLAN_SHA: ${{ needs.plan-prod.outputs.plan_sha }}
          APPROVED_SHA: ${{ vars.TERRAFORM_APPROVED_PLAN_SHA256 }}
          APPROVED_COMMIT: ${{ vars.TERRAFORM_APPROVED_COMMIT_SHA }}
          TARGET_ENV: prod
        shell: bash
        run: bash scripts/gha/verify_plan_handoff.sh

      - name: Initialize Terraform (prod)
        env:
          STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=environments/prod init -input=false \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="region=eu-west-1"

      - name: Enforce ownership on saved plan (prod)
        env:
          TERRAFORM_DESTRUCTION_APPROVAL: ${{ vars.TERRAFORM_DESTRUCTION_APPROVAL }}
        shell: bash
        run: |
          python3 scripts/gha/check_plan_ownership.py --environment prod --plan environments/prod/tfplan > "$RUNNER_TEMP/terraform-prod-ownership.log" 2>&1 || { echo "Ownership gate failed; diagnostic remains on the runner." >&2; exit 1; }

      - name: Apply Terraform plan (prod)
        shell: bash
        run: |
          terraform -chdir=environments/prod apply -input=false tfplan > "$RUNNER_TEMP/terraform-prod-apply.log" 2>&1 || { echo "Terraform PROD apply failed; diagnostic remains on the runner." >&2; exit 1; }
