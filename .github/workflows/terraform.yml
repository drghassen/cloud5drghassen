name: terraform-infrastructure

"on":
  push:
    branches:
      - main
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - ".tflint.hcl"
      - ".github/workflows/**"

  pull_request:
    paths:
      - "modules/**"
      - "environments/**"
      - "bootstrap/**"
      - "scripts/**"
      - "docs/**"
      - "README.md"
      - ".gitignore"
      - ".pre-commit-config.yaml"
      - ".tflint.hcl"
      - ".github/workflows/**"

  workflow_dispatch:
    inputs:
      operation:
        description: validate runs CI only. deploy targets one environment. promote runs DEV, then TEST, then PROD.
        type: choice
        required: true
        default: validate
        options:
          - validate
          - deploy
          - promote
      target_environment:
        description: Used only when operation is deploy. Ignored for validate and promote.
        type: choice
        required: true
        default: dev
        options:
          - dev
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('terraform-pr-{0}', github.event.pull_request.number) || format('terraform-run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/terraform-ci.yml

  policy:
    name: Select deployment mode
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      deploy_dev: ${{ steps.decide.outputs.deploy_dev }}
      deploy_test: ${{ steps.decide.outputs.deploy_test }}
      deploy_prod: ${{ steps.decide.outputs.deploy_prod }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Decide which environments this run may deploy
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          GIT_REF: ${{ github.ref }}
          OPERATION: ${{ github.event.inputs.operation }}
          TARGET_ENVIRONMENT: ${{ github.event.inputs.target_environment }}
        run: python3 scripts/gha/deployment_policy.py

  dev-stage:
    name: Deploy DEV
    needs:
      - ci
      - policy
    if: needs.policy.outputs.deploy_dev == 'true'
    concurrency:
      group: terraform-state-dev-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-environment-stage.yml
    with:
      environment: dev

  test-stage:
    name: Deploy TEST
    needs:
      - ci
      - policy
      - dev-stage
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.policy.result == 'success' &&
      needs.policy.outputs.deploy_test == 'true' &&
      (needs.policy.outputs.deploy_dev != 'true' || needs.dev-stage.result == 'success')
    concurrency:
      group: terraform-state-test-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-environment-stage.yml
    with:
      environment: test

  prod-stage:
    name: Deploy PROD
    needs:
      - ci
      - policy
      - test-stage
    if: >-
      always() &&
      needs.ci.result == 'success' &&
      needs.policy.result == 'success' &&
      needs.policy.outputs.deploy_prod == 'true' &&
      (needs.policy.outputs.deploy_test != 'true' || needs.test-stage.result == 'success')
    concurrency:
      group: terraform-state-prod-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-environment-stage.yml
    with:
      environment: prod
