name: terraform-environment-stage

"on":
  workflow_call:
    inputs:
      environment:
        description: Terraform environment to plan and apply (dev, test, or prod).
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    name: Plan ${{ inputs.environment }}
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-plan.yml
    with:
      environment: ${{ inputs.environment }}

  deploy:
    name: Apply ${{ inputs.environment }}
    needs: plan
    permissions:
      actions: write
      contents: read
      id-token: write
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: ${{ inputs.environment }}
      plan_sha256: ${{ needs.plan.outputs.plan_sha256 }}
